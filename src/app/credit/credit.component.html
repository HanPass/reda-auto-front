<div class="cards-grid">
  <mat-card>
    <h3>Clients débiteurs</h3>
    <ul><li *ngFor="let c of debiteurs$ | async">{{ c.nom }} - {{ c.creditActuel }} MAD</li></ul>
  </mat-card>
  <mat-card>
    <h3>Remboursement</h3>
    <form [formGroup]="form" (ngSubmit)="rembourser()">
      <mat-form-field><mat-label>Client</mat-label><input matInput formControlName="client"></mat-form-field>
      <mat-form-field><mat-label>Montant</mat-label><input matInput type="number" formControlName="montant"></mat-form-field>
      <button mat-raised-button color="primary">Enregistrer</button>
    </form>
  </mat-card>
</div>
<mat-card style="margin-top:1rem;">
  <h3>Historique transactions</h3>
  <ul><li *ngFor="let h of historique$ | async">{{ h.date | date:'short' }} - {{ h.client }}: {{ h.montant }} MAD</li></ul>
</mat-card>
