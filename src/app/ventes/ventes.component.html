<mat-card>
  <h3>Interface vente (POS)</h3>
  <form [formGroup]="form">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;">
      <mat-form-field><mat-label>Produit</mat-label><mat-select formControlName="produitId"><mat-option *ngFor="let p of produits$ | async" [value]="p.id">{{ p.nom }}</mat-option></mat-select></mat-form-field>
      <mat-form-field><mat-label>Quantité</mat-label><input matInput type="number" formControlName="qte"></mat-form-field>
      <mat-form-field><mat-label>Paiement</mat-label><mat-select formControlName="mode"><mat-option value="cash">Cash</mat-option><mat-option value="carte">Carte</mat-option><mat-option value="credit">Crédit</mat-option></mat-select></mat-form-field>
      <mat-form-field *ngIf="form.value.mode==='credit'"><mat-label>Client</mat-label><mat-select formControlName="clientId"><mat-option *ngFor="let c of clients$ | async" [value]="c.id">{{ c.nom }}</mat-option></mat-select></mat-form-field>
    </div>
  </form>
  <button mat-raised-button color="primary" (click)="addLigne()">Ajouter produit</button>
  <ul><li *ngFor="let l of lignes">{{ l.nom }} x{{ l.qte }} = {{ l.qte * l.prixUnitaire }} MAD</li></ul>
  <h4>Total: {{ total }} MAD</h4>
  <button mat-raised-button color="accent" (click)="valider()">Valider la vente</button>
</mat-card>
