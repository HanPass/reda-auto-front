<ng-container *ngIf="!isAuthRoute; else authLayout">
  <mat-sidenav-container class="layout">
    <mat-sidenav [mode]="mobile ? 'over' : 'side'" [(opened)]="menuOpened">
      <div class="brand"><span class="brand-mark">RA</span><div><strong>Reda Auto</strong><small>Gestion magasin</small></div></div>
      <mat-nav-list><a mat-list-item *ngFor="let item of visibleMenu" [routerLink]="item.path" routerLinkActive="active-link" (click)="closeOnMobile()"><mat-icon matListItemIcon>{{ item.icon }}</mat-icon><span matListItemTitle>{{ item.label }}</span></a></mat-nav-list>
      <div class="demo-label"><mat-icon>science</mat-icon><span>Données de démonstration</span></div>
    </mat-sidenav>
    <mat-sidenav-content>
      <mat-toolbar class="topbar">
        <button mat-icon-button (click)="menuOpened = !menuOpened" aria-label="Ouvrir le menu"><mat-icon>menu</mat-icon></button>
        <div class="store"><strong>Magasin principal</strong><small>Rabat · Dépôt A</small></div><span class="spacer"></span>
        <mat-form-field appearance="outline" class="country-field"><mat-label>Pays</mat-label><mat-select [value]="country$ | async" (selectionChange)="selectCountry($event.value)"><mat-option value="MA">Maroc · MAD</mat-option><mat-option value="FR">France · EUR</mat-option></mat-select></mat-form-field>
        <button mat-icon-button matTooltip="Notifications" aria-label="Notifications"><mat-icon [matBadge]="3" matBadgeColor="warn">notifications</mat-icon></button>
        <button mat-button [matMenuTriggerFor]="profileMenu" class="profile"><mat-icon>account_circle</mat-icon><span>{{ username }}</span></button>
        <mat-menu #profileMenu="matMenu"><button mat-menu-item (click)="toggleTheme(true)"><mat-icon>dark_mode</mat-icon>Mode sombre</button><button mat-menu-item (click)="toggleTheme(false)"><mat-icon>light_mode</mat-icon>Mode clair</button><button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon>Déconnexion</button></mat-menu>
      </mat-toolbar>
      <main class="content"><router-outlet></router-outlet></main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>
<ng-template #authLayout><router-outlet></router-outlet></ng-template>
