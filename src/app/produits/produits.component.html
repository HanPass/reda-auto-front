<mat-card>
  <div style="display:flex;gap:8px;align-items:center;">
    <mat-form-field><mat-label>Recherche</mat-label><input matInput (input)="onSearch($any($event.target).value)"></mat-form-field>
    <button mat-raised-button color="primary" (click)="openDialog()">Ajouter</button>
  </div>
  <div class="table-wrap">
    <table mat-table [dataSource]="(produits$ | async) || []">
      <ng-container matColumnDef="nom"><th mat-header-cell *matHeaderCellDef>Nom</th><td mat-cell *matCellDef="let row">{{ row.nom }}</td></ng-container>
      <ng-container matColumnDef="prix"><th mat-header-cell *matHeaderCellDef>Prix</th><td mat-cell *matCellDef="let row">{{ row.prix }} MAD</td></ng-container>
      <ng-container matColumnDef="stock"><th mat-header-cell *matHeaderCellDef>Stock</th><td mat-cell *matCellDef="let row">{{ row.stock }} <span *ngIf="row.stock < row.seuilAlerte" class="alert-badge">Alerte</span></td></ng-container>
      <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef></th><td mat-cell *matCellDef="let row"><button mat-button (click)="openDialog(row)">Edit</button><button mat-button color="warn" (click)="delete(row.id)">Suppr.</button></td></ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
  <mat-paginator [length]="20" [pageSize]="5" (page)="pageChange($event.pageIndex)"></mat-paginator>
</mat-card>
